<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Remote</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div><p class="eyebrow" data-i18n="localControl">LOCAL CONTROL</p><h1>Codex Remote</h1></div>
        <div class="topbar-actions"><label class="language-picker"><span data-i18n="language">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">简体中文</option></select></label><button id="refresh" class="button" type="button" data-i18n="refresh">Refresh</button></div>
    </header>
    <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden><span id="message-text"></span><button id="copy-message" class="mini-button" type="button" hidden data-i18n="copy">Copy</button></div>
    <div id="dashboard" class="dashboard">
        <section class="panel installed-only" aria-labelledby="app-server-title">
            <div class="panel-heading"><div><p class="eyebrow" data-i18n="runtime">RUNTIME</p><h2 id="app-server-title" data-i18n="appServer">Codex app-server</h2></div><div class="service-action"><strong id="app-server-state" class="state-offline" data-i18n="offline">Offline</strong><button id="toggle-app-server" class="button secondary" type="button" data-i18n="start">Start</button></div></div>
            <p id="app-server-detail" class="muted" data-i18n="stopped">Stopped</p>
            <div class="copy-field"><span id="app-server-address">-</span><button id="copy-app-server" class="mini-button" type="button" data-i18n="copy">Copy</button></div>
            <div class="listen-settings"><label><span data-i18n="listenAddress">Listen address</span><input id="listen-host" type="text" inputmode="decimal" autocomplete="off" value="127.0.0.1" required /></label><label><span data-i18n="port">Port</span><input id="listen-port" type="number" min="1" max="65535" value="11037" required /></label><button id="save-listen" class="mini-button" type="button" data-i18n="saveRestart">Save &amp; restart</button></div>
        </section>
        <section class="panel installed-only" aria-labelledby="tunnel-title">
            <div class="panel-heading"><div><p class="eyebrow" data-i18n="remoteAccess">REMOTE ACCESS</p><h2 id="tunnel-title" data-i18n="cloudflareTunnel">Cloudflare Tunnel</h2></div><div class="service-action"><strong id="tunnel-state" class="state-offline" data-i18n="offline">Offline</strong><button id="toggle-tunnel" class="button secondary" type="button" data-i18n="start">Start</button></div></div>
            <p id="tunnel-detail" class="muted" data-i18n="stopped">Stopped</p>
            <div id="tunnel-address" class="copy-field" hidden><span id="tunnel-address-value">-</span><button id="copy-tunnel" class="mini-button" type="button" data-i18n="copy">Copy</button></div>
        </section>
        <section class="panel installed-only devices-panel" aria-labelledby="devices-title">
            <div class="panel-heading"><div><p class="eyebrow" data-i18n="devices">DEVICES</p><h2 id="devices-title" data-i18n="boundDevices">Bound devices</h2></div><button id="bind-device" class="button secondary" type="button" data-i18n="bindDevice">Bind new device</button></div>
            <div id="pairing-code" hidden><p id="pairing-expiry" class="muted"></p><div class="copy-field"><span id="pairing-value"></span><button id="copy-pairing" class="mini-button" type="button" data-i18n="copy">Copy</button></div></div>
            <ul id="device-list" class="device-list"><li class="muted" data-i18n="noDevices">No devices bound</li></ul>
        </section>
        <section id="environment-card" class="panel environment-card" aria-labelledby="status-title">
            <div class="panel-heading"><div><p class="eyebrow" data-i18n="environment">ENVIRONMENT</p><h2 id="status-title" data-i18n="environmentStatus">Environment status</h2></div><div class="meta"><strong id="platform">-</strong><span id="checked-at">-</span></div></div>
            <div class="tool-list" aria-label="Local tools" data-i18n-aria-label="localTools">
                <div class="tool-row"><div><span>Node.js</span><strong id="tool-node" class="tool-status" data-i18n="checking">Checking</strong></div><button id="install-node" class="mini-button" type="button" data-i18n="install">Install</button></div>
                <div class="tool-row"><div><span>Codex CLI</span><strong id="tool-codex" class="tool-status" data-i18n="checking">Checking</strong></div><button id="install-codex" class="mini-button" type="button" data-i18n="install">Install</button></div>
                <div class="tool-row"><div><span>Cloudflared</span><strong id="tool-cloudflared" class="tool-status" data-i18n="checking">Checking</strong></div><button id="install-cloudflared" class="mini-button" type="button" data-i18n="install">Install</button></div>
            </div>
        </section>
    </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
